    <!-- Static pages ship real markup in #root for crawlers. Visitors with
         JavaScript keep it hidden until the app mounts, so there is no
         flash of un-animated content. -->
    <style>
      .js #root[data-prerendered] { visibility: hidden; }
    </style>
    <script>
      (function () {
        var root = document.documentElement;
        root.classList.add("js");
        try {
          var stored = localStorage.getItem("theme");
          var light = stored === "light" || (!stored && window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches);
          root.dataset.theme = light ? "light" : "dark";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.content = light ? "#f6f5f1" : "#0b0b0c";
        } catch (e) {}
      })();
    </script>
