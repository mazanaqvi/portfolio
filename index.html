    <script>
      (function () {
        var root = document.documentElement;
        root.classList.add("js");
        // Name intro: first page load of a visit only, never for the prerender
        // capture. Reduced-motion visitors are handled in CSS.
        try {
          if (/AliHumzaPrerender/.test(navigator.userAgent) || sessionStorage.getItem("intro-seen")) {
            root.classList.add("no-intro");
          } else {
            sessionStorage.setItem("intro-seen", "1");
          }
        } catch (e) {}
        try {
          var stored = localStorage.getItem("theme");
          var light = stored === "light" || (!stored && window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches);
          root.dataset.theme = light ? "light" : "dark";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.content = light ? "#f6f5f1" : "#0b0b0c";
        } catch (e) {}
      })();
    </script>

    <style>
      /* ---------- name intro (plays once per visit, ~1.8 s) ---------- */
      #intro {
        position: fixed;
        inset: 0;
        z-index: 2000;
        display: grid;
        place-items: center;
        background: #0b0b0c;
        color: #f3f3ee;
        font-family: "Geist Variable", "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        animation: intro-out 0.6s cubic-bezier(0.76, 0, 0.24, 1) 1.2s forwards;
      }
      html[data-theme="light"] #intro { background: #f6f5f1; color: #121211; }
      .no-intro #intro { display: none; }
      @media (prefers-reduced-motion: reduce) { #intro { display: none; } }

      #intro .intro-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.1rem;
        animation: intro-lift 0.5s cubic-bezier(0.76, 0, 0.24, 1) 1.1s forwards;
      }
      #intro .intro-mark {
        width: clamp(52px, 5.5vw, 72px);
        height: clamp(52px, 5.5vw, 72px);
        border-radius: 14px;
        opacity: 0;
        transform: scale(0.6) rotate(-12deg);
        animation: intro-mark 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.05s forwards;
      }
      #intro .intro-name {
        display: flex;
        overflow: hidden;
        padding: 0.08em 0.04em 0.12em;
        font-size: clamp(2.6rem, 9vw, 5.25rem);
        font-weight: 600;
        letter-spacing: -0.04em;
        line-height: 1;
      }
      #intro .intro-name span {
        display: inline-block;
        transform: translateY(115%);
        animation: intro-letter 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        animation-delay: calc(0.15s + var(--i) * 45ms);
      }
      #intro .intro-name .gap { width: 0.28em; }
      #intro .intro-name .last {
        font-family: "Instrument Serif", Georgia, serif;
        font-style: italic;
        font-weight: 400;
        letter-spacing: 0;
        color: #c8f135;
      }
      html[data-theme="light"] #intro .intro-name .last { color: #4b7500; }
      #intro .intro-role {
        font-family: "Geist Mono", ui-monospace, Menlo, monospace;
        font-size: 0.72rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        opacity: 0;
        animation: intro-fade 0.4s ease 0.55s forwards;
      }
      #intro .intro-bar {
        width: 132px;
        height: 2px;
        border-radius: 2px;
        overflow: hidden;
        background: rgba(127, 127, 127, 0.22);
      }
      #intro .intro-bar span {
        display: block;
        height: 100%;
        background: #c8f135;
        transform: scaleX(0);
        transform-origin: left;
        animation: intro-bar 1s cubic-bezier(0.65, 0, 0.35, 1) 0.1s forwards;
      }
      #intro.intro-skip { animation: intro-fade-out 0.25s ease forwards; }

      @keyframes intro-mark { to { opacity: 1; transform: none; } }
      @keyframes intro-letter { to { transform: none; } }
      @keyframes intro-fade { to { opacity: 0.6; } }
      @keyframes intro-bar { to { transform: scaleX(1); } }
      @keyframes intro-lift { to { opacity: 0; transform: translateY(-24px); } }
      @keyframes intro-out {
        to { transform: translateY(-100%); visibility: hidden; pointer-events: none; }
      }
      @keyframes intro-fade-out {
        to { opacity: 0; visibility: hidden; pointer-events: none; }
      }
    </style>

      </div>
    </div>
    <script>
      (function () {
        var el = document.getElementById("intro");
        if (!el || document.documentElement.classList.contains("no-intro")) return;
        var events = ["pointerdown", "keydown", "wheel", "touchstart"];
        function done() {
          events.forEach(function (t) { removeEventListener(t, skip); });
          if (el.parentNode) el.parentNode.removeChild(el);
        }
        function skip() {
          el.classList.add("intro-skip");
          setTimeout(done, 260);
        }
        el.addEventListener("animationend", function (e) {
          if (e.target === el) done();
        });
        events.forEach(function (t) { addEventListener(t, skip, { passive: true }); });
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
